name: Lista braków w danych (Polska)

# Uruchamiane ręcznie: Actions → „Lista braków w danych (Polska)” → Run workflow.
# Wynik (CSV) do pobrania jako artefakt „braki” i na gałęzi „dane-braki” (plik braki.csv).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  braki:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pobierz produkty z Polski i wypisz braki
        run: python3 scripts/missing_data.py --out braki.csv
      - uses: actions/upload-artifact@v4
        with:
          name: braki
          path: braki.csv
          retention-days: 30
      - name: Zapisz na gałęzi dane-braki
        run: |
          mkdir out && cp braki.csv out/ && cd out
          git init -q -b dane-braki && git config user.name "github-actions" && git config user.email "actions@github.com"
          git add braki.csv && git commit -qm "Lista braków $(date -u +%F)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dane-braki
