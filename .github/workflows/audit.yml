# Audyt jakości (Lighthouse): szybkość na słabszym telefonie, dostępność, dobre praktyki, instalacja PWA.
# Uruchamiany ręcznie (Actions → Audyt jakości → Run workflow). Wynik trafia do gałęzi „audit” (plik audit/summary.json).
name: Audyt jakości

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lighthouse (telefon, wolniejsza sieć)
        run: |
          mkdir -p out runs
          for page in start produkt; do
            url="https://lupka.app/"
            [ "$page" = produkt ] && url="https://lupka.app/#/p/5900197012723"
            # 3 przebiegi, bo maszyny GitHuba mają zmienną moc – bierzemy przebieg ze środkowym wynikiem szybkości.
            for n in 1 2 3; do
              npx --yes lighthouse@12 "$url" --quiet --output=json --output-path="runs/$page-$n.json" \
                --form-factor=mobile --screenEmulation.mobile --throttling-method=simulate \
                --chrome-flags="--headless=new --no-sandbox" || true
            done
            node -e '
              const fs = require("fs"); const p = process.argv[1];
              const runs = [1, 2, 3].map(n => "runs/" + p + "-" + n + ".json").filter(f => fs.existsSync(f))
                .map(f => ({ f, s: JSON.parse(fs.readFileSync(f)).categories.performance.score })).sort((a, b) => a.s - b.s);
              console.log(p, runs.map(r => Math.round(r.s * 100)).join(" "));
              fs.copyFileSync(runs[Math.floor(runs.length / 2)].f, "out/" + p + ".json");
              fs.writeFileSync("out-" + p + ".scores", runs.map(r => Math.round(r.s * 100)).join(","));
            ' "$page"
          done
          node -e '
            const fs = require("fs"); const out = {};
            for (const f of fs.readdirSync("out")) {
              const r = JSON.parse(fs.readFileSync("out/" + f));
              const cats = Object.fromEntries(Object.entries(r.categories).map(([k, c]) => [k, Math.round(c.score * 100)]));
              const failed = Object.values(r.audits).filter(a => a.score !== null && a.score < 0.9 && a.scoreDisplayMode !== "informative" && a.scoreDisplayMode !== "manual")
                .map(a => ({ id: a.id, title: a.title, score: a.score, value: a.displayValue || "", items: ((a.details && a.details.items) || []).slice(0, 5).map(i => (i.node && (i.node.snippet || i.node.selector)) || i.url || i.label || "").filter(Boolean) }));
              const detail = {};
              for (const id of ["mainthread-work-breakdown", "bootup-time", "long-tasks", "network-requests"]) {
                const a = r.audits[id]; if (!a || !a.details || !a.details.items) continue;
                detail[id] = a.details.items.slice(0, id === "network-requests" ? 40 : 12).map(i => Object.fromEntries(Object.entries(i).filter(([k, v]) => typeof v !== "object").map(([k, v]) => [k, typeof v === "number" ? Math.round(v) : v])));
              }
              out[f.replace(".json", "")] = { categories: cats, metrics: { fcp: r.audits["first-contentful-paint"].displayValue, lcp: r.audits["largest-contentful-paint"].displayValue, tbt: r.audits["total-blocking-time"].displayValue, cls: r.audits["cumulative-layout-shift"].displayValue, si: r.audits["speed-index"].displayValue }, failed, detail, runs: fs.readFileSync("out-" + f.replace(".json", "") + ".scores", "utf8") };
            }
            fs.mkdirSync("audit", { recursive: true });
            fs.writeFileSync("audit/summary.json", JSON.stringify({ at: new Date().toISOString(), pages: out }, null, 1));
          '
      - name: Zapis wyniku w gałęzi audit
        run: |
          cd audit
          git init -q -b audit
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add summary.json && git commit -q -m "Audyt Lighthouse"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" audit
